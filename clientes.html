<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | AutoAgenda</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/armazenamento.js" defer></script>
  <script src="js/utilidades.js" defer></script>
  <script src="js/clientes.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <a class="marca" href="index.html">AutoAgenda</a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="clientes.html" aria-current="page">Clientes</a></li>
        <li><a href="veiculos.html">Veículos</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="ordens.html">Ordens de serviço</a></li>
        <li><a href="historico.html">Histórico</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <h1>Clientes</h1>
    <p id="mensagem" class="mensagem" role="status"></p>

    <section class="cartao">
      <h2 id="titulo-formulario">Novo cliente</h2>

      <form id="formulario">
        <input type="hidden" id="cliente-id">

        <label for="cliente-nome">Nome *</label>
        <input type="text" id="cliente-nome" required maxlength="100" autocomplete="name">

        <label for="cliente-telefone">Telefone com DDD *</label>
        <input type="tel" id="cliente-telefone" required autocomplete="tel"
               placeholder="(11) 98765-4321"
               pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
               title="Telefone com DDD, ex.: (11) 98765-4321">

        <label for="cliente-email">E-mail</label>
        <input type="email" id="cliente-email" maxlength="120" autocomplete="email">

        <p class="dica">* Campo obrigatório</p>

        <button type="submit" id="botao-salvar" class="botao botao-principal">Cadastrar cliente</button>
        <button type="button" id="botao-cancelar" class="botao" hidden>Cancelar edição</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Clientes cadastrados</h2>

      <label for="pesquisa">Pesquisar</label>
      <input type="search" id="pesquisa" placeholder="Nome, telefone ou e-mail">

      <div class="tabela-rolavel">
        <table>
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Telefone</th>
              <th scope="col">E-mail</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="lista-vazia" class="dica" hidden>Nenhum cliente encontrado.</p>
    </section>
  </main>

  <footer class="rodape">
    <p>AutoAgenda · Projeto Integrador · Senac 2026</p>
  </footer>
</body>
</html>
