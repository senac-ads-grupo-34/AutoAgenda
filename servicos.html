<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços | AutoAgenda</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/armazenamento.js" defer></script>
  <script src="js/utilidades.js" defer></script>
  <script src="js/servicos.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <a class="marca" href="index.html">AutoAgenda</a>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="veiculos.html">Veículos</a></li>
        <li><a href="servicos.html" aria-current="page">Serviços</a></li>
        <li><a href="ordens.html">Ordens de serviço</a></li>
        <li><a href="historico.html">Histórico</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <h1>Serviços</h1>
    <p id="mensagem" class="mensagem" role="status"></p>

    <section class="cartao">
      <h2 id="titulo-formulario">Novo serviço</h2>

      <form id="formulario">
        <input type="hidden" id="servico-id">

        <label for="servico-nome">Nome do serviço *</label>
        <input type="text" id="servico-nome" required maxlength="60"
               placeholder="Ex.: Troca de óleo">

        <label for="servico-tempo">Tempo médio em minutos *</label>
        <input type="number" id="servico-tempo" required min="5" max="600" step="5"
               placeholder="Ex.: 60"
               title="Tempo médio de atendimento, de 5 a 600 minutos">

        <label for="servico-preco">Preço em reais *</label>
        <input type="number" id="servico-preco" required min="0" max="99999" step="0.01"
               placeholder="Ex.: 150,50"
               title="Preço do serviço, use ponto para os centavos">

        <p class="dica">* Campo obrigatório</p>

        <button type="submit" id="botao-salvar" class="botao botao-principal">Cadastrar serviço</button>
        <button type="button" id="botao-cancelar" class="botao" hidden>Cancelar edição</button>
      </form>
    </section>

    <section class="cartao">
      <h2>Serviços cadastrados</h2>

      <label for="pesquisa">Pesquisar</label>
      <input type="search" id="pesquisa" placeholder="Nome do serviço">

      <div class="tabela-rolavel">
        <table>
          <thead>
            <tr>
              <th scope="col">Serviço</th>
              <th scope="col">Tempo médio</th>
              <th scope="col">Preço</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p id="lista-vazia" class="dica" hidden>Nenhum serviço encontrado.</p>
    </section>
  </main>

  <footer class="rodape">
    <p>AutoAgenda · Projeto Integrador · Senac 2026</p>
  </footer>
</body>
</html>
